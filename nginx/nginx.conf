# [각주 1] Nginx : 외부에서 들어오는 요청을 맨 앞에서 받아서 안쪽 서버(여기선 Spring)로
# 전달해주는 "문지기(리버스 프록시)" 프로그램. 당당 설계 문서(백엔드 설계 기획서 2.1절)에서
# "배포 시에는 앞단에 Nginx만 추가하면 된다"고 정해둔 바로 그 계층입니다.
#
# 지금은 Android 앱이 EC2 IP:80 으로만 접속하면 되고, /api/* 든 뭐든 전부 Spring(8080)으로만
# 넘겨주면 됩니다 — FastAPI(8000)는 아예 밖으로 안 열려있어서 이 설정에 등장할 필요도 없습니다.

server {
    listen 80;
    server_name _; # [각주 2] 특정 도메인이 아직 없으니 "아무 이름이나 다 받는다"는 뜻. 나중에 도메인이 생기면 실제 도메인 이름으로 바꿔주면 됩니다.

    # [각주 3] 업로드하는 음식 사진 등 요청 바디 용량 제한을 넉넉히 잡아둡니다(기본값 1m는 사진 하나로도 초과할 수 있음).
    client_max_body_size 20m;

    location / {
        proxy_pass http://backend:8080; # docker-compose가 만들어준 내부 네트워크에서 backend 컨테이너로 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
