# [각주 1] docker-compose.yml : 여러 개의 컨테이너(Spring/FastAPI/Nginx)를 "한 세트"로
# 묶어서, 한 번의 명령(`docker compose up -d`)으로 다 같이 켜고 끌 수 있게 해주는 설정 파일.
# 저장소 최상위(DangDang/)에 이 파일 하나만 두면 됩니다.
#
# [각주 2] DB는 여기 안 들어있습니다 — 기존에 쓰던 학원(SMHRD) PostgreSQL 서버를 그대로
# 계속 씁니다(BackEnd/.env, AIServer/fastapi_app/.env의 DB_URL이 이미 그 서버를 가리킴).
# 새로 DB 컨테이너를 만들지 않은 이유는, DB는 사용자가 직접 관리하기로 한 원칙과 이미
# 운영 중인 데이터를 그대로 유지하기 위함입니다.

services:
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: dangdang-backend
    env_file:
      - ./BackEnd/.env
    environment:
      # [각주 3] .env 파일의 FASTAPI_BASE_URL은 로컬 개발용 값(http://localhost:8000)입니다.
      # docker-compose 안에서는 "localhost"가 backend 컨테이너 자기 자신을 가리키게 되어
      # fastapi 컨테이너로 연결이 안 됩니다. docker-compose가 만들어주는 내부 네트워크에서는
      # 서비스 이름(fastapi)이 곧 호스트명이 되므로, 여기서 .env 값을 덮어씁니다.
      FASTAPI_BASE_URL: http://fastapi:8000
    expose:
      - "8080" # [각주 4] 컨테이너 "안"에서만 열림 — 바깥(EC2 밖)에서 직접 8080으로 못 들어옵니다. nginx만 거쳐서 들어오게 하기 위함(설계문서의 "앱은 Spring만, 그것도 Nginx를 거쳐서" 원칙).
    depends_on:
      - fastapi
    restart: unless-stopped

  fastapi:
    build:
      context: ./AIServer/fastapi_app
      dockerfile: Dockerfile
    container_name: dangdang-fastapi
    env_file:
      - ./AIServer/fastapi_app/.env
    expose:
      - "8000" # [각주 5] 이것도 컨테이너 안에서만 열림 — FastAPI는 원래부터 "앱이 직접 못 부르고 Spring만 부를 수 있어야" 하는 서버라서, 아예 EC2 바깥으로 포트를 안 엽니다(가장 안전한 방식).
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: dangdang-nginx
    ports:
      - "80:80" # [각주 6] 여기만 "80:80"으로 진짜 바깥(EC2 퍼블릭 IP)에 열립니다 — 사람이 외부에서 접속할 수 있는 유일한 문.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
